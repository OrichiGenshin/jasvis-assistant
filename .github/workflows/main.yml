
name: Build JARVIS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract JARVIS project
        run: |
          unzip -q JarvisAndroid-Starter.zip -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "No Gradle wrapper found. Check the project ZIP."
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
